<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cloud Setup</title><link rel="stylesheet" href="control.css"></head><body><div class="wrap"><div class="toolbar"><a class="btn" href="../admin.html">← MAIN ADMIN</a></div><div class="panel"><h2>CLOUD LIVE SYNC SETUP</h2><p class="note">Streamer alag PC par ho to Firebase Realtime Database zaroori hai. Firebase Console se Web App config JSON paste karo. Database Rules testing ke liye read/write true rakh sakte ho; public link share karte waqt private room ID use karo.</p><div class="field"><label>Firebase config JSON</label><textarea id="config" rows="9" placeholder='{"apiKey":"...","authDomain":"...","databaseURL":"https://...","projectId":"..."}'></textarea></div><div class="field"><label>Private Room ID</label><input id="room" placeholder="gs-event-2026"></div><div class="toolbar"><button class="btn primary" id="save">SAVE CLOUD SETUP</button><button class="btn" id="generate">GENERATE STREAMER LINKS</button></div><div id="links" class="viewer-list"></div></div></div><script src="gs-firebase.js"></script><script src="setup.js"></script></body></html>
